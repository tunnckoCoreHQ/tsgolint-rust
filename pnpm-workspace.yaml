packages:
  - "tsgolint-rust/e2e"
  - "tsgolint-rules/tests/data"
  # The published packages, which changesets versions.
  - "npm/tsgolint-rust"
  - "npm/wasm32-wasip1"

catalogMode: prefer

catalogs:
  default:
    "@changesets/changelog-github": 1.0.1
    "@changesets/cli": 3.0.3
    fast-glob: ^3.3.3
    # oxlint runs tsgolint-rust on oxc's tsgolint CLI fixtures
    # (tsgolint-compare/oxlint-fixtures.sh); the README lists the tested versions.
    oxlint: 1.86.0
    # The Go tsgolint that tsgolint-rust ports, at the tag in UPSTREAM.json. It is
    # the oracle of tsgolint-rust/tests/cli.rs and tsgolint-compare, and moves
    # only with a port to a newer tsgolint.
    oxlint-tsgolint: 7.0.2004
    turbo: 2.11.7
    vitest: 5.0.3
  types:
    "@types/node": ^24
    typescript: 7.0.2

name: Set up tsgolint-rust
description: >-
  The Rust toolchain of rust-toolchain.toml, Node and pnpm, the workspace's npm
  dependencies, and optionally wasmtime and the Namespace cache volume mounts.

inputs:
  cache:
    description: Mount ~/.cargo/registry, ~/.cargo/git, target/ and the pnpm store on the Namespace cache volume.
    default: "true"
  wasmtime:
    description: Install wasmtime, for the e2e suite on the wasm build.
    default: "false"
  install:
    description: Run `pnpm install`.
    default: "true"

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Mount the caches
      if: inputs.cache == 'true'
      uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
      with:
        cache: pnpm
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target

    - name: Install the Rust toolchain
      shell: bash
      run: |
        rustup toolchain install
        rustup show active-toolchain

    - name: Install wasmtime
      if: inputs.wasmtime == 'true'
      shell: bash
      env:
        WASMTIME_VERSION: 44.0.1
      run: |
        case "$(uname -m)" in
          x86_64) arch=x86_64 ;;
          aarch64 | arm64) arch=aarch64 ;;
          *) echo "no wasmtime build for $(uname -m)"; exit 1 ;;
        esac
        case "$RUNNER_OS" in
          Linux) os=linux ;;
          macOS) os=macos ;;
          *) echo "no wasmtime build for $RUNNER_OS"; exit 1 ;;
        esac
        name="wasmtime-v$WASMTIME_VERSION-$arch-$os"
        curl -fsSL "https://github.com/bytecodealliance/wasmtime/releases/download/v$WASMTIME_VERSION/$name.tar.xz" \
          | tar -xJ -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/$name/wasmtime" --version

    - name: Install npm dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

name: publish-nightly

# After ci passes on a master push with pending changesets, publishes a
# snapshot version of them to npm with nightly: tsgolint-rust, its platform
# packages and its wasm package.
#
# SECURITY: npm trusts this workflow file in the nightly environment, which
# allows only master. npm accepts OIDC tokens only from GitHub-hosted runners,
# so the publish job runs on one; everything else runs on Namespace. No
# repository secrets: the job token only lets the changelog writer read
# commits and pull requests.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: publish-nightly
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: namespace-profile-tsgolint-rust
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.changesets.outputs.pending }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: changesets
        run: |
          if compgen -G '.changeset/*.md' > /dev/null; then
            echo pending=true >> "$GITHUB_OUTPUT"
          else
            echo "Not published: no pending changesets" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: build
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}

  publish:
    name: publish (nightly)
    needs: build
    environment: nightly
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
      pull-requests: read # the changelog writer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tsgolint-*
          path: artifacts
      - name: Publish
        env:
          # @changesets/changelog-github reads commit and PR data through the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/release/publish.sh nightly artifacts

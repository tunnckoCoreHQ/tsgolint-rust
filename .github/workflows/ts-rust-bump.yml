name: ts-rust bump

# Moves ts-rust to the head of its branch when the head changes its compiler
# sources, regenerates the snapshots and opens a pull request. The pull
# request merges by itself when no snapshot changed and CI passes.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ts-rust-bump

jobs:
  bump:
    name: Bump ts-rust
    runs-on: namespace-profile-tsgolint-rust
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          wasmtime: "true"

      - name: Move ts-rust
        id: bump
        run: scripts/upstream/ts-rust-bump.sh | tee -a "$GITHUB_OUTPUT"

      # Snapshot differences are written, not failed on. Other failures show
      # in the next step.
      - name: Regenerate the snapshots
        if: steps.bump.outputs.bump == 'true'
        run: |
          TSGOLINT_UPDATE_SNAPSHOTS=1 cargo test -p tsgolint-rules --test rules -- --test-threads 4 || true
          cargo build -p tsgolint-rust
          TSGOLINT_BIN="$PWD/target/debug/tsgolint" pnpm --dir tsgolint-rust/e2e run e2e -- --update || true

      - name: Check and test
        id: test
        if: steps.bump.outputs.bump == 'true'
        continue-on-error: true
        run: pnpm exec turbo run check test

      - name: Write the pull request
        id: body
        if: steps.bump.outputs.bump == 'true'
        env:
          FROM: ${{ steps.bump.outputs.from }}
          TO: ${{ steps.bump.outputs.to }}
          TYPESCRIPT: ${{ steps.bump.outputs.typescript }}
          TESTS: ${{ steps.test.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary=$(scripts/upstream/snapshot-summary.sh)
          {
            echo "Moves ts-rust from [\`${FROM:0:8}\`](https://github.com/pingdotgg/ts-rust/commit/$FROM) to [\`${TO:0:8}\`](https://github.com/pingdotgg/ts-rust/commit/$TO) ([compare](https://github.com/pingdotgg/ts-rust/compare/$FROM...$TO)), which ports TypeScript [\`${TYPESCRIPT:0:12}\`](https://github.com/microsoft/TypeScript/commit/$TYPESCRIPT)."
            echo
            if [ "$TESTS" = success ]; then
              echo "Check and test pass with the regenerated snapshots."
            else
              echo "**Check or test fails** with the regenerated snapshots, so the change is more than snapshot text: a rule case's expectations, the command line or the wasm build. See the [workflow run]($RUN_URL)."
            fi
            echo
            if [ -z "$summary" ]; then
              echo "No snapshot changed."
            else
              echo "### Snapshot changes"
              echo
              echo "Each change needs a cause in ts-rust: the TypeScript revision, or a fix. Review them before merging."
              echo
              echo "$summary"
            fi
          } > "$RUNNER_TEMP/pr-body.md"
          if [ -z "$summary" ] && [ "$TESTS" = success ]; then
            echo "automerge=true" >> "$GITHUB_OUTPUT"
          fi
          # The changeset puts the move in the next nightly and release.
          cat > ".changeset/ts-rust-${TO:0:8}.md" <<CHANGESET
          ---
          "tsgolint-rust": patch
          ---

          Move ts-rust to [\`${TO:0:8}\`](https://github.com/pingdotgg/ts-rust/commit/$TO), which ports TypeScript [\`${TYPESCRIPT:0:12}\`](https://github.com/microsoft/TypeScript/commit/$TYPESCRIPT).
          CHANGESET

      # A pull request opened with GITHUB_TOKEN starts no workflow, so CI
      # would never run on it: BOT_TOKEN is a personal token that can.
      - name: Open the pull request
        id: pr
        if: steps.bump.outputs.bump == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.BOT_TOKEN || github.token }}
          branch: deps/ts-rust
          delete-branch: true
          signoff: true
          add-paths: |
            .changeset
            Cargo.lock
            UPSTREAM.json
            tsgolint-rules/tests/data/snapshots
            tsgolint-rust/e2e/__snapshots__
          commit-message: "build(deps): move ts-rust to ${{ steps.bump.outputs.short }}"
          title: "build(deps): move ts-rust to ${{ steps.bump.outputs.short }}"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: dependencies

      - name: Merge when CI passes
        if: steps.body.outputs.automerge == 'true' && steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash

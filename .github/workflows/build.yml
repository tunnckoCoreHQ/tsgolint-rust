name: build

# The release builds of every npm target, uploaded as the artifacts
# tsgolint-<target>. publish-nightly and publish-prod call it.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build.
        type: string
        required: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.npm }})
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # Static musl builds, each on a machine of its architecture. The
          # machines by label get a cache volume for the git mirror of the
          # Namespace checkout; the profile has both.
          - npm: linux-x64
            target: x86_64-unknown-linux-musl
            runner: [namespace-profile-tsgolint-rust]
          - npm: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: [nscloud-ubuntu-24.04-arm64-8x16-with-cache, nscloud-cache-tag-tsgolint-rust-linux-arm64, nscloud-git-mirror-5gb]
          # One macOS arm64 machine; x64 is a cross build.
          - npm: darwin-arm64
            target: aarch64-apple-darwin
            runner: [nscloud-macos-tahoe-arm64-6x14-with-cache, nscloud-cache-tag-tsgolint-rust-macos, nscloud-cache-size-50gb, nscloud-git-mirror-5gb]
          - npm: darwin-x64
            target: x86_64-apple-darwin
            runner: [nscloud-macos-tahoe-arm64-6x14-with-cache, nscloud-cache-tag-tsgolint-rust-macos, nscloud-cache-size-50gb, nscloud-git-mirror-5gb]
          # Windows has no C dependency (jemalloc is off there), so both
          # targets cross-compile on Linux with cargo-xwin and the MSVC SDK.
          # The Namespace account cannot create Windows machines.
          - npm: win32-x64
            target: x86_64-pc-windows-msvc
            runner: [namespace-profile-tsgolint-rust]
          - npm: win32-arm64
            target: aarch64-pc-windows-msvc
            runner: [namespace-profile-tsgolint-rust]
          - npm: wasm32-wasip1
            target: wasm32-wasip1
            runner: [namespace-profile-tsgolint-rust]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustup show active-toolchain

      - name: Install musl-gcc
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          # jemalloc is C: build it with musl-gcc. The settings that a glibc
          # build applies with an exec at start (src/main.rs) are built in.
          target=$(echo '${{ matrix.target }}' | tr '-' '_')
          {
            echo "CC_$target=musl-gcc"
            echo "JEMALLOC_SYS_WITH_MALLOC_CONF=narenas:4,thp:always,metadata_thp:disabled,cache_oblivious:false"
          } >> "$GITHUB_ENV"

      - name: Install cargo-xwin
        if: endsWith(matrix.target, '-windows-msvc')
        env:
          CARGO_XWIN_VERSION: 0.23.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm
          # clang-cl, lld-link and llvm-lib, unversioned.
          llvm-config --bindir >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/rust-cross/cargo-xwin/releases/download/v$CARGO_XWIN_VERSION/cargo-xwin-v$CARGO_XWIN_VERSION.x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" cargo-xwin
          cargo xwin --version
          echo "CARGO_BUILD=xwin build" >> "$GITHUB_ENV"

      - name: Build
        run: |
          # CARGO_BUILD is `xwin build` for Windows: split it into words.
          # shellcheck disable=SC2086
          cargo ${CARGO_BUILD:-build} --release --locked -p tsgolint-rust --target ${{ matrix.target }}

      - name: Collect the binary
        run: |
          dir=target/${{ matrix.target }}/release
          mkdir -p dist
          case '${{ matrix.target }}' in
            wasm32-*) cp "$dir/tsgolint.wasm" dist/ ;;
            *-windows-*) cp "$dir/tsgolint.exe" dist/ ;;
            *) cp "$dir/tsgolint" dist/ ;;
          esac
          ls -l dist

      - name: Check that the binary is static
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          # A static binary has no program interpreter (no ld.so to load).
          if readelf -l dist/tsgolint | grep -q 'INTERP'; then
            readelf -l dist/tsgolint | grep -A1 INTERP
            exit 1
          fi
          echo '{"version":2}' | dist/tsgolint headless

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsgolint-${{ matrix.npm }}
          path: dist/
          if-no-files-found: error

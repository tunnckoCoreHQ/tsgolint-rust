name: Release

# Push a tag `v<version>`, where <version> is the Cargo workspace version.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    name: Check the version
    runs-on: namespace-profile-tsgolint-rust
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag names the Cargo workspace version
        run: |
          version=$(node npm/scripts/packages.mjs version)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match the Cargo workspace version $version"
            exit 1
          fi
          node npm/scripts/packages.mjs check

  build:
    name: Build ${{ matrix.npm }}
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # Static musl builds, each on a machine of its architecture.
          - npm: linux-x64
            target: x86_64-unknown-linux-musl
            runner: namespace-profile-tsgolint-rust
          - npm: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: nscloud-ubuntu-24.04-arm64-8x16
          # One macOS arm64 machine; x64 is a cross build.
          - npm: darwin-arm64
            target: aarch64-apple-darwin
            runner: nscloud-macos-tahoe-arm64-6x14
          - npm: darwin-x64
            target: x86_64-apple-darwin
            runner: nscloud-macos-tahoe-arm64-6x14
          # Windows uses the default allocator. One x64 machine; arm64 is a
          # cross build with MSVC's ARM64 tools.
          - npm: win32-x64
            target: x86_64-pc-windows-msvc
            runner: nscloud-windows-2022-amd64-8x16
          - npm: win32-arm64
            target: aarch64-pc-windows-msvc
            runner: nscloud-windows-2022-amd64-8x16
          - npm: wasm32-wasip1
            target: wasm32-wasip1
            runner: namespace-profile-tsgolint-rust
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustup show active-toolchain

      - name: Install musl-gcc
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          # jemalloc is C: build it with musl-gcc. The settings that a glibc
          # build applies with an exec at start (src/main.rs) are built in.
          target=$(echo '${{ matrix.target }}' | tr '-' '_')
          {
            echo "CC_$target=musl-gcc"
            echo "JEMALLOC_SYS_WITH_MALLOC_CONF=narenas:4,thp:always,metadata_thp:disabled,cache_oblivious:false"
          } >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: cargo build --release --locked -p tsgolint-rust --target ${{ matrix.target }}

      - name: Collect the binary
        shell: bash
        run: |
          dir=target/${{ matrix.target }}/release
          mkdir -p dist
          case '${{ matrix.target }}' in
            wasm32-*) cp "$dir/tsgolint.wasm" dist/ ;;
            *-windows-*) cp "$dir/tsgolint.exe" dist/ ;;
            *) cp "$dir/tsgolint" dist/ ;;
          esac
          ls -l dist

      - name: Check that the binary is static
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          ldd dist/tsgolint 2>&1 | tee /dev/stderr | grep -q 'statically linked\|not a dynamic executable'
          echo '{"version":2}' | dist/tsgolint headless

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsgolint-${{ matrix.npm }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: namespace-profile-tsgolint-rust
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tsgolint-*
          path: artifacts

      - name: Generate the npm packages
        run: node npm/scripts/packages.mjs generate artifacts "$GITHUB_REF_NAME" | tee packages.txt

      # The platform packages first, then the wasm package, then
      # tsgolint-rust, which depends on the platform packages. A version that
      # is already on npm is skipped, so a failed run can run again.
      - name: Publish
        run: |
          npm --version
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          while read -r dir; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is on npm already"
              continue
            fi
            (cd "$dir" && npm publish --provenance --access public --tag "$tag")
          done < packages.txt

      - name: Collect the release files
        run: |
          mkdir -p release
          for dir in artifacts/tsgolint-*; do
            target=${dir#artifacts/tsgolint-}
            for file in "$dir"/*; do
              case "$file" in
                *.exe) cp "$file" "release/tsgolint-$target.exe" ;;
                *.wasm) cp "$file" "release/tsgolint-$target.wasm" ;;
                *) cp "$file" "release/tsgolint-$target" ;;
              esac
            done
          done
          (cd release && sha256sum * > SHA256SUMS)
          ls -l release

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release/*

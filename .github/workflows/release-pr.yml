name: Release PR

# After CI passes on a master push, opens or updates the release PR from the
# pending changesets. Merging it runs publish-prod.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  release-pr:
    name: Open or update the release PR
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The script compares the release with the one on the release branch.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # A pull request opened with the job token starts no workflow, so CI
      # would never run on it: BOT_TOKEN is a personal token that can. It also
      # pushes the release branch and lets the changelog writer read the
      # commits and pull requests.
      - name: Open or update the release PR
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: bash scripts/release/release-pr.sh

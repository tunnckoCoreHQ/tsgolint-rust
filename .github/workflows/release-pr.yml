name: release-pr

# After ci passes on a master push, opens or updates the release PR from the
# pending changesets. Merging it runs publish-prod.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  release-pr:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: namespace-profile-tsgolint-rust
    # The bot environment holds OLSTENLARCK_HQ_PAT and allows only master.
    environment: bot
    permissions:
      contents: read
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The script compares the release with the one on the release branch.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # A pull request opened with the job token starts no workflow, so ci
      # would never run on it: OLSTENLARCK_HQ_PAT is a personal token that can. It
      # also pushes the release branch and lets the changelog writer read the
      # commits and pull requests.
      - name: Open or update the release PR
        env:
          GITHUB_TOKEN: ${{ secrets.OLSTENLARCK_HQ_PAT }}
          GH_TOKEN: ${{ secrets.OLSTENLARCK_HQ_PAT }}
        run: bash scripts/release/release-pr.sh

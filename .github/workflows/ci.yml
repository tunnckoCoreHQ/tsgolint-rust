name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release tsgolint-rust') && 'release' || 'normal' }}"
  cancel-in-progress: true

env:
  # Pull requests read the turbo remote cache but never write to it.
  TURBO_CACHE: ${{ github.event_name == 'pull_request' && 'local:rw,remote:rw' || 'local:rw,remote:rw' }}
  CARGO_TERM_COLOR: always

# Every job of an OS runs on the same machine shape and shares its Namespace
# cache volume (cargo registry, git deps, target/, the pnpm store) and git
# mirror, and all of them share the turbo remote cache. Only master commits
# to the cache volumes.
#
# - linux: the tsgolint-rust profile, linux/amd64, 4 vCPU, 8 GB.
# - macos: macOS arm64 by label. The account has no Windows machines, so
#   Windows is not tested; its release builds cross-compile on Linux.
jobs:
  # fmt, clippy and the npm package check. They do not depend on the OS.
  check:
    runs-on: [namespace-profile-tsgolint-rust]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: namespace-actions/setup-turbocache@3b82149ffb545cab670093f13bc0bad156917e18 # v0.0.4
      - run: pnpm exec turbo run check

  # The Rust tests: rule cases, unit, golden and CLI tests.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: &os
        include:
          - os: linux
            runs-on: [namespace-profile-tsgolint-rust]
          - os: macos
            runs-on:
              - nscloud-macos-tahoe-arm64-6x14-with-cache
              - nscloud-cache-tag-tsgolint-rust-macos
              - nscloud-cache-size-50gb
              - nscloud-cache-allow-commit-from-master
              - nscloud-git-mirror-5gb
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: namespace-actions/setup-turbocache@3b82149ffb545cab670093f13bc0bad156917e18 # v0.0.4
      - run: pnpm exec turbo run test

  # tsgolint's e2e suite on the native debug build.
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: *os
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: namespace-actions/setup-turbocache@3b82149ffb545cab670093f13bc0bad156917e18 # v0.0.4
      - run: pnpm exec turbo run e2e

  # tsgolint's e2e suite on the wasm32-wasip1 debug build under wasmtime.
  e2e-wasm:
    name: e2e-wasm (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: *os
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          wasmtime: "true"
      - uses: namespace-actions/setup-turbocache@3b82149ffb545cab670093f13bc0bad156917e18 # v0.0.4
      - run: pnpm exec turbo run e2e:wasm

  # The release builds, native and wasm32-wasip1.
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: *os
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: namespace-actions/setup-turbocache@3b82149ffb545cab670093f13bc0bad156917e18 # v0.0.4
      - run: pnpm exec turbo run build

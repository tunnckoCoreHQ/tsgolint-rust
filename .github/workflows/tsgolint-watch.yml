name: tsgolint watch

# Opens an issue when oxc-project/tsgolint releases a version newer than the
# one in UPSTREAM.json, with the compare link and the changed rule files.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  watch:
    name: Look for a new tsgolint release
    runs-on: namespace-profile-tsgolint-rust
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare with UPSTREAM.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/upstream/tsgolint-watch.sh
